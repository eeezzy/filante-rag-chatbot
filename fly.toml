app = "filante-rag-chatbot"
primary_region = "nrt"  # Tokyo — closest Fly.io region to Korea

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0  # scale to zero when idle — no traffic, no cost

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"  # BGE-M3 + torch needs headroom beyond the smallest tier
