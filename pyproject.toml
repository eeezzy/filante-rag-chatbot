[project]
name = "filante-rag"
version = "0.1.0"
description = "Production RAG chatbot over the FILANTE vehicle owner's manual"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pymupdf>=1.25.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "tenacity>=8.3",
    "langfuse>=2.50",
    "h2>=4.4.1",  # CVE-2026-71554, pulled in transitively pre-4.4.1
]

[project.optional-dependencies]
retrieval = [
    "qdrant-client>=1.9",
    "FlagEmbedding>=1.2",
]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filante_rag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
